@if (isAuthenticated() || isPublicPage) {
    <app-navbar />
}
@if (isLoading()) {
    <ngx-spinner [fullScreen]="true" type="fire" size="medium" color="#ff5722"
        bdColor="rgba(0, 0, 0, 0.8)">
        <p style="color: white; margin-top: 50px;">Verifying Session...</p>
    </ngx-spinner>
} @else {
    <router-outlet />
}
