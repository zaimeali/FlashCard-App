<div class="fc-card-frame"
  [ngClass]="{'flipped': isFlipped, 'skipped': status === 'skipped' && !isCurrentSkipped, 'dragging': isDragging()}"
  [style.transform]="getTransform()"
  [style.transition]="isDragging() ? 'none' : ''"
  (click)="active ? flipCard() : null"
  (touchstart)="active ? onTouchStart($event) : null"
  (touchmove)="active ? onTouchMove($event) : null"
  (touchend)="active ? onTouchEnd($event) : null"
>
  <!-- FRONT -->
  <div class="fc-card-face fc-front">
    @if (status === 'skipped') {
      <div class="fc-status-badge">
        <mat-icon>replay</mat-icon> SKIPPED
      </div>
    }
    @if (!isFlipped) {
      <span class="fc-flip-hint">{{ isTouchDevice ? 'Tap' : 'Click' }} to view answer</span>
    }
    <div class="fc-content">
      <h2>{{ cardData?.question }}</h2>
    </div>
    <!-- Actions mounted on BOTH SIDES natively based on constraints -->
    @if (active) {
      <div class="fc-actions">
        <button mat-icon-button (click)="onAction('incorrect', $event)" 
          [class.selected]="status === 'incorrect'" class="action-btn incorrect" aria-label="Incorrect">
          <mat-icon>thumb_down</mat-icon>
        </button>
        <button mat-icon-button (click)="onAction('skip', $event)" 
          [class.selected]="status === 'skipped'" class="action-btn skip" aria-label="Skip">
          <mat-icon>replay</mat-icon>
        </button>
        <button mat-icon-button (click)="onAction('correct', $event)" 
          [class.selected]="status === 'correct'" class="action-btn correct" aria-label="Correct">
          <mat-icon>thumb_up</mat-icon>
        </button>
      </div>
    }
  </div>

  <!-- BACK -->
  <div class="fc-card-face fc-back">
    @if (status === 'skipped') {
      <div class="fc-status-badge">
        <mat-icon>replay</mat-icon> SKIPPED
      </div>
    }
    <div class="fc-content">
      <p class="fc-answer">{{ cardData?.answer }}</p>
    </div>
    <!-- Actions mounted on BOTH SIDES natively based on constraints -->
    @if (active) {
      <div class="fc-actions">
        <button mat-icon-button (click)="onAction('incorrect', $event)" 
          [class.selected]="status === 'incorrect'" class="action-btn incorrect" aria-label="Incorrect">
          <mat-icon>thumb_down</mat-icon>
        </button>
        <button mat-icon-button (click)="onAction('skip', $event)" 
          [class.selected]="status === 'skipped'" class="action-btn skip" aria-label="Skip">
          <mat-icon>replay</mat-icon>
        </button>
        <button mat-icon-button (click)="onAction('correct', $event)" 
          [class.selected]="status === 'correct'" class="action-btn correct" aria-label="Correct">
          <mat-icon>thumb_up</mat-icon>
        </button>
      </div>
    }
  </div>
</div>
