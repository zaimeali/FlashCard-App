<mat-toolbar class="fc-navbar" color="primary">
    <div class="fc-navbar-left" routerLink="/">
        <img src="/logo.svg" alt="Logo" class="fc-logo-icon" />
        <div class="fc-brand-text-container">
            <span class="fc-logo-text">FlashCard</span>
            <!-- Motto for mobile screens -->
            <span class="fc-motto mobile-only-motto">Learn Smarter, Not Harder</span>
        </div>
    </div>

    <!-- Motto for desktop screens -->
    <div class="fc-navbar-middle desktop-only">
        <span class="fc-motto">Learn Smarter, Not Harder</span>
    </div>

    <div class="fc-navbar-right">
        <!-- Desktop Buttons -->
        <div class="fc-desktop-actions">
            <button mat-button class="fc-nav-btn primary-colored" routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">My Groups</button>
            <button mat-button class="fc-nav-btn primary-colored" routerLink="/profile" routerLinkActive="active-link">Profile</button>
            <button mat-button class="fc-nav-btn fc-warn-btn" routerLink="/login">Logout</button>
        </div>

        <!-- Mobile Hamburger Menu -->
        <div class="fc-mobile-actions">
            <button mat-icon-button [matMenuTriggerFor]="appMenu" class="fc-menu-trigger">
                <mat-icon>menu</mat-icon>
            </button>
            <mat-menu #appMenu="matMenu" class="fc-custom-menu">
                <button mat-menu-item routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}">
                    <mat-icon>dashboard</mat-icon>
                    <span>My Groups</span>
                </button>
                <button mat-menu-item routerLink="/profile" routerLinkActive="active-link">
                    <mat-icon>person</mat-icon>
                    <span>Profile</span>
                </button>
                <button mat-menu-item routerLink="/login" class="fc-warn-menu-item">
                    <mat-icon>logout</mat-icon>
                    <span>Logout</span>
                </button>
            </mat-menu>
        </div>
    </div>
</mat-toolbar>
